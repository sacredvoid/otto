<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Otto onboarding: ready</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#24594A}a:hover{color:#17332A}
button{font-family:inherit;cursor:pointer}
</style>
</helmet>
<div style="width: 760px; height: 540px; box-sizing: border-box; background: #FFFFFF; color: #1C2622; font-family: 'Geist', system-ui, sans-serif; display: flex; flex-direction: column">
  <div style="display: flex; justify-content: space-between; align-items: center; padding: 22px 28px">
    <div style="display: flex; align-items: center; gap: 8px">
      <svg width="24" height="24" viewBox="0 0 100 100" aria-hidden="true"><path d="M50 12 C74 10 88 26 86 48 C84 68 68 78 48 78 C26 78 12 64 14 44 C16 24 30 13 50 12 Z" fill="#CFE6F3"></path><path d="M34 46 Q39 40 44 46" fill="none" stroke="#2F6F62" stroke-width="6" stroke-linecap="round"></path><path d="M56 46 Q61 40 66 46" fill="none" stroke="#2F6F62" stroke-width="6" stroke-linecap="round"></path><path d="M38 76 L48 81 L38 86 Z M62 76 L52 81 L62 86 Z" fill="#8CC9B2" stroke="#8CC9B2" stroke-width="6" stroke-linejoin="round"></path></svg>
      <span style="font-size: 15px; font-weight: 600">Otto</span>
    </div>
    <span style="font-size: 13px; color: #5B6B65">5 / 5</span>
  </div>

  <div style="flex: 1; display: flex; flex-direction: column; padding: 0 72px">
    <h1 style="margin: 0; font-size: 26px; font-weight: 600; letter-spacing: -0.01em">Here's what Otto can use</h1>
    <p style="margin: 8px 0 18px; font-size: 14px; color: #5B6B65">Found in Claude Code. To add or remove one, change it there.</p>

    <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); column-gap: 32px">
      <div style="display: flex; justify-content: space-between; align-items: center; padding: 12px 0; border-top: 1px solid #EDF2EF">
        <span style="font-size: 14px">Google Calendar</span>
        <span style="width: 8px; height: 8px; border-radius: 4px; background: #6DBF9C" aria-label="Connected" role="img"></span>
      </div>
      <div style="display: flex; justify-content: space-between; align-items: center; padding: 12px 0; border-top: 1px solid #EDF2EF">
        <span style="font-size: 14px">Gmail</span>
        <span style="width: 8px; height: 8px; border-radius: 4px; background: #6DBF9C" aria-label="Connected" role="img"></span>
      </div>
      <div style="display: flex; justify-content: space-between; align-items: center; padding: 12px 0; border-top: 1px solid #EDF2EF; border-bottom: 1px solid #EDF2EF">
        <span style="font-size: 14px">GitHub</span>
        <span style="width: 8px; height: 8px; border-radius: 4px; background: #6DBF9C" aria-label="Connected" role="img"></span>
      </div>
      <div style="display: flex; justify-content: space-between; align-items: center; padding: 12px 0; border-top: 1px solid #EDF2EF; border-bottom: 1px solid #EDF2EF">
        <span style="font-size: 14px">Files <span style="color: #5B6B65">(built in)</span></span>
        <span style="width: 8px; height: 8px; border-radius: 4px; background: #6DBF9C" aria-label="Connected" role="img"></span>
      </div>
    </div>

    <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); column-gap: 32px; margin-top: 28px">
      <div style="display: flex; flex-direction: column; gap: 8px">
        <span style="font-size: 13px; color: #5B6B65">Results are saved to</span>
        <div style="display: flex; align-items: center; gap: 12px">
          <span style="font-family: 'Geist Mono', monospace; font-size: 13px">~/Otto/tasks</span>
          <button style="padding: 0; border: 0; background: transparent; color: #24594A; font-size: 13px; font-weight: 500">Change</button>
        </div>
      </div>
      <div style="display: flex; flex-direction: column; gap: 8px">
        <span style="font-size: 13px; color: #5B6B65">Otto asks first before it</span>
        <span style="font-size: 14px">sends, deletes or runs commands</span>
      </div>
    </div>
  </div>

  <div style="display: flex; justify-content: space-between; align-items: center; padding: 22px 28px">
    <span style="font-size: 13px; color: #5B6B65">Try: "summarize the newest PDF in Downloads"</span>
    <button style="height: 44px; padding: 0 24px; border-radius: 10px; border: 0; background: #2F6F62; color: #FFFFFF; font-size: 15px; font-weight: 500">Start using Otto</button>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":760,"height":540}}'>
class Component extends DCLogic {
  renderVals() {
    return {};
  }
}
</script>
</body>
</html>
