<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Otto onboarding: welcome</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#24594A}a:hover{color:#17332A}
button{font-family:inherit;cursor:pointer}
.m{transform-box:fill-box;transform-origin:50% 100%}
.breathe{animation:breathe 3.6s ease-in-out infinite}
@keyframes breathe{0%,100%{transform:scale(1,1)}50%{transform:scale(1.035,.965)}}
@media (prefers-reduced-motion: reduce){.m{animation:none !important}}
</style>
</helmet>
<div style="width: 760px; height: 540px; box-sizing: border-box; background: #FFFFFF; color: #1C2622; font-family: 'Geist', system-ui, sans-serif; display: flex; flex-direction: column">
  <div style="display: flex; justify-content: space-between; align-items: center; padding: 22px 28px">
    <div style="display: flex; align-items: center; gap: 8px">
      <svg width="24" height="24" viewBox="0 0 100 100" aria-hidden="true"><path d="M50 12 C74 10 88 26 86 48 C84 68 68 78 48 78 C26 78 12 64 14 44 C16 24 30 13 50 12 Z" fill="#CFE6F3"></path><path d="M34 46 Q39 40 44 46" fill="none" stroke="#2F6F62" stroke-width="6" stroke-linecap="round"></path><path d="M56 46 Q61 40 66 46" fill="none" stroke="#2F6F62" stroke-width="6" stroke-linecap="round"></path><path d="M38 76 L48 81 L38 86 Z M62 76 L52 81 L62 86 Z" fill="#8CC9B2" stroke="#8CC9B2" stroke-width="6" stroke-linejoin="round"></path></svg>
      <span style="font-size: 15px; font-weight: 600">Otto</span>
    </div>
    <span style="font-size: 13px; color: #5B6B65">1 / 5</span>
  </div>

  <div style="flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px; padding: 0 96px; text-align: center">
    <svg width="96" height="96" viewBox="0 0 100 100" aria-hidden="true"><g class="m breathe"><path d="M50 12 C74 10 88 26 86 48 C84 68 68 78 48 78 C26 78 12 64 14 44 C16 24 30 13 50 12 Z" fill="#CFE6F3"></path><path d="M34 46 Q39 40 44 46" fill="none" stroke="#2F6F62" stroke-width="4" stroke-linecap="round"></path><path d="M56 46 Q61 40 66 46" fill="none" stroke="#2F6F62" stroke-width="4" stroke-linecap="round"></path><path d="M38 76 L48 81 L38 86 Z M62 76 L52 81 L62 86 Z" fill="#8CC9B2" stroke="#8CC9B2" stroke-width="5" stroke-linejoin="round"></path><circle cx="50" cy="81" r="3.5" fill="#2F6F62"></circle></g></svg>
    <h1 style="margin: 0; font-size: 34px; font-weight: 600; letter-spacing: -0.02em">Hi, I'm Otto.</h1>
    <p style="margin: 0; font-size: 16px; line-height: 1.6; color: #5B6B65">Hold a key, say what just popped into your head, and get back to work. I'll take care of it in the background.</p>
    <p style="margin: 0; font-size: 13px; color: #5B6B65">I never touch your screen, and I ask before sending or deleting anything.</p>
  </div>

  <div style="display: flex; justify-content: space-between; align-items: center; padding: 22px 28px">
    <div style="display: flex; flex-direction: column; gap: 6px; width: 220px">
      <span style="font-size: 12px; color: #5B6B65">Preparing speech model, 38%</span>
      <div style="height: 3px; border-radius: 2px; background: #EDF2EF"><div style="width: 38%; height: 3px; border-radius: 2px; background: #8CC9B2"></div></div>
    </div>
    <button style="height: 44px; padding: 0 24px; border-radius: 10px; border: 0; background: #2F6F62; color: #FFFFFF; font-size: 15px; font-weight: 500">Get started</button>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":760,"height":540}}'>
class Component extends DCLogic {
  renderVals() {
    return {};
  }
}
</script>
</body>
</html>
