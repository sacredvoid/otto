<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 340" width="880" height="340" role="img" aria-label="Otto in five steps: hold the hotkey and talk, Otto transcribes it, works in the background, asks before sending, then shows the result.">
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    .cap { font-size: 15px; font-weight: 600; fill: #24594a; }
    .num { font-size: 12px; font-weight: 700; fill: #fff; }
    .t { font-size: 14px; font-weight: 600; fill: #1c2622; }
    .s { font-size: 13px; fill: #5b6b65; }
    .m { font-size: 12px; fill: #3a4a44; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
    .card { fill: #fff; stroke: #e3ebe7; }
    .sc { opacity: 0; animation: 15s linear infinite; }
    .s1 { animation-name: a1; } .s2 { animation-name: a2; } .s3 { animation-name: a3; }
    .s4 { animation-name: a4; } .s5 { animation-name: a5; } .s34 { animation-name: a34; }
    @keyframes a1 { 0%, 17% { opacity: 1 } 20%, 100% { opacity: 0 } }
    @keyframes a2 { 0%, 20% { opacity: 0 } 23%, 37% { opacity: 1 } 40%, 100% { opacity: 0 } }
    @keyframes a3 { 0%, 40% { opacity: 0 } 43%, 57% { opacity: 1 } 60%, 100% { opacity: 0 } }
    @keyframes a4 { 0%, 60% { opacity: 0 } 63%, 77% { opacity: 1 } 80%, 100% { opacity: 0 } }
    @keyframes a5 { 0%, 80% { opacity: 0 } 83%, 97% { opacity: 1 } 100% { opacity: 0 } }
    @keyframes a34 { 0%, 40% { opacity: 0 } 43%, 77% { opacity: 1 } 80%, 100% { opacity: 0 } }
    .bar { transform-box: fill-box; transform-origin: center; animation: wave .9s ease-in-out infinite alternate; }
    .bar:nth-child(2) { animation-delay: -.3s } .bar:nth-child(3) { animation-delay: -.6s }
    .bar:nth-child(4) { animation-delay: -.15s } .bar:nth-child(5) { animation-delay: -.45s }
    @keyframes wave { from { transform: scaleY(.3) } to { transform: scaleY(1) } }
    .run { animation: run 1.6s ease-in-out infinite; }
    @keyframes run { from { transform: translateX(-60px) } to { transform: translateX(150px) } }
    .blink { transform-box: fill-box; transform-origin: center; animation: blink 3s infinite; }
    @keyframes blink { 0%, 92%, 100% { transform: scaleY(1) } 95% { transform: scaleY(.1) } }
    @media (prefers-reduced-motion: reduce) { .sc, .bar, .run, .blink { animation: none; } .s5 { opacity: 1; } }
  </style>

  <defs>
    <linearGradient id="desk" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#EEF6F2"/><stop offset="1" stop-color="#E3EEF6"/>
    </linearGradient>
    <clipPath id="barclip"><rect x="674" y="304" width="150" height="3" rx="1.5"/></clipPath>
    <filter id="sh" x="-10%" y="-10%" width="120%" height="140%"><feDropShadow dx="0" dy="4" stdDeviation="7" flood-color="#1c2622" flood-opacity=".12"/></filter>
  </defs>

  <rect width="880" height="340" rx="20" fill="url(#desk)"/>

  <!-- the work you keep doing -->
  <g opacity=".85">
    <rect x="36" y="64" width="470" height="244" rx="12" fill="#fff" stroke="#e3ebe7"/>
    <circle cx="56" cy="82" r="5" fill="#eed6d3"/><circle cx="72" cy="82" r="5" fill="#f2e6c9"/><circle cx="88" cy="82" r="5" fill="#d6ecdf"/>
    <g fill="#e9efec">
      <rect x="60" y="112" width="300" height="9" rx="4.5"/><rect x="60" y="134" width="390" height="9" rx="4.5"/>
      <rect x="60" y="156" width="340" height="9" rx="4.5"/><rect x="60" y="178" width="250" height="9" rx="4.5"/>
      <rect x="60" y="214" width="370" height="9" rx="4.5"/><rect x="60" y="236" width="310" height="9" rx="4.5"/>
    </g>
    <rect x="312" y="174" width="2" height="17" fill="#2f6f62"/>
  </g>

  <!-- captions -->
  <g class="sc s1"><circle cx="48" cy="34" r="11" fill="#2f6f62"/><text class="num" x="48" y="38" text-anchor="middle">1</text><text class="cap" x="68" y="39">Hold ⌃ ⌥ Space and say what you need</text></g>
  <g class="sc s2"><circle cx="48" cy="34" r="11" fill="#2f6f62"/><text class="num" x="48" y="38" text-anchor="middle">2</text><text class="cap" x="68" y="39">Let go. Whisper transcribes it on your Mac</text></g>
  <g class="sc s3"><circle cx="48" cy="34" r="11" fill="#2f6f62"/><text class="num" x="48" y="38" text-anchor="middle">3</text><text class="cap" x="68" y="39">Claude Code works on it in the background</text></g>
  <g class="sc s4"><circle cx="48" cy="34" r="11" fill="#2b5677"/><text class="num" x="48" y="38" text-anchor="middle">4</text><text class="cap" x="68" y="39" style="fill:#2b5677">Anything risky waits for your OK</text></g>
  <g class="sc s5"><circle cx="48" cy="34" r="11" fill="#2f6f62"/><text class="num" x="48" y="38" text-anchor="middle">5</text><text class="cap" x="68" y="39">The result lands when it's done</text></g>

  <!-- 1: listening pill -->
  <g class="sc s1" filter="url(#sh)">
    <rect class="card" x="170" y="262" width="210" height="44" rx="22"/>
    <circle cx="196" cy="284" r="11" fill="#ddf1e6"/><circle cx="196" cy="284" r="5" fill="#2f6f62"/>
    <g fill="#8cc9b2">
      <rect class="bar" x="218" y="272" width="4" height="24" rx="2"/><rect class="bar" x="227" y="272" width="4" height="24" rx="2"/>
      <rect class="bar" x="236" y="272" width="4" height="24" rx="2"/><rect class="bar" x="245" y="272" width="4" height="24" rx="2"/>
      <rect class="bar" x="254" y="272" width="4" height="24" rx="2"/>
    </g>
    <text class="s" x="272" y="289">Listening…</text>
  </g>

  <!-- 2: heard pill -->
  <g class="sc s2" filter="url(#sh)">
    <rect class="card" x="90" y="262" width="380" height="44" rx="22"/>
    <circle cx="116" cy="284" r="11" fill="#ddf1e6"/><path d="M110 284 l4 4 l8 -8" fill="none" stroke="#2f6f62" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
    <text class="t" x="136" y="289" style="font-weight:500">"Reply to Priya, Friday at 3 works"</text>
    <text class="s" x="408" y="289">0.4s</text>
  </g>

  <!-- 3 and 4: corner chip -->
  <g class="sc s3" filter="url(#sh)">
    <rect class="card" x="628" y="258" width="214" height="56" rx="16"/>
    <g transform="translate(638 264) scale(.3)"><path d="M50 12 C74 10 88 26 86 48 C84 68 68 78 48 78 C26 78 12 64 14 44 C16 24 30 13 50 12 Z" fill="#CFE6F3"/><circle class="blink" cx="76" cy="44" r="5.5" fill="#2F6F62"/></g>
    <text class="t" x="674" y="279" style="font-size:13px">Reply to Priya</text>
    <text class="s" x="674" y="294" style="font-size:12px">Reading your email…</text>
    <g clip-path="url(#barclip)"><rect x="674" y="304" width="150" height="3" fill="#e3ebe7"/><rect class="run" x="674" y="304" width="60" height="3" fill="#8cc9b2"/></g>
  </g>
  <g class="sc s4" filter="url(#sh)">
    <rect class="card" x="660" y="270" width="182" height="36" rx="18"/>
    <g transform="translate(668 271) scale(.3)"><path d="M50 12 C74 10 88 26 86 48 C84 68 68 78 48 78 C26 78 12 64 14 44 C16 24 30 13 50 12 Z" fill="#CFE6F3"/><circle cx="39" cy="44" r="6.5" fill="#1F3E5A"/><circle cx="61" cy="44" r="6.5" fill="#1F3E5A"/></g>
    <text class="t" x="704" y="293" style="font-size:13px;fill:#2b5677;font-weight:500">1 needs you</text>
  </g>

  <!-- 4: approval card -->
  <g class="sc s4" filter="url(#sh)">
    <rect x="548" y="64" width="294" height="186" rx="14" fill="#f5f9fd" stroke="#cfe0ef"/>
    <text class="s" x="566" y="90" style="font-size:12px">Reply to Priya</text>
    <text class="t" x="566" y="112">Gmail: send message</text>
    <rect x="566" y="124" width="258" height="64" rx="8" fill="#e8f0f7"/>
    <text class="m" x="578" y="146">to: priya@studio.co</text>
    <text class="m" x="578" y="166">"Friday at 3 works for me,</text>
    <text class="m" x="578" y="180">see you then."</text>
    <rect x="566" y="202" width="86" height="32" rx="8" fill="#2b5677"/><text x="609" y="223" text-anchor="middle" style="font-size:13px;font-weight:600;fill:#fff">Allow</text>
    <text class="s" x="672" y="223">Don't allow</text>
  </g>

  <!-- 5: result card -->
  <g class="sc s5" filter="url(#sh)">
    <rect class="card" x="548" y="64" width="294" height="140" rx="14"/>
    <circle cx="574" cy="92" r="11" fill="#ddf1e6"/><path d="M568 92 l4 4 l8 -8" fill="none" stroke="#2f6f62" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
    <text class="t" x="594" y="97">Reply to Priya</text>
    <text class="s" x="566" y="128">Sent from your Gmail:</text>
    <text class="s" x="566" y="146">"Friday at 3 works for me."</text>
    <rect x="566" y="162" width="118" height="26" rx="6" fill="#f3f7f5"/><text class="s" x="578" y="180" style="font-size:12px">View in History</text>
  </g>
</svg>
