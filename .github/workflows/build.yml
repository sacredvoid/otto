# Every push to main and every PR: tests, then a macOS DMG and a Windows
# installer kept as workflow artifacts. A pushed tag like v0.5.0 also
# publishes both as one GitHub Release.
name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
    # Docs-only pushes don't need the 10-minute builds.
    paths-ignore: ["**.md", "docs/**"]
  pull_request:
    paths-ignore: ["**.md", "docs/**"]
  workflow_dispatch:

permissions:
  contents: write # only used by the release job on tags
  pull-requests: read # lets the changes job list a PR's files

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14 # Apple Silicon, matches the aarch64 DMG
            bundle: src-tauri/target/release/bundle/dmg/*.dmg
          - os: windows-latest
            bundle: src-tauri/target/release/bundle/nsis/*.exe
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # The Windows speech engine builds its Vulkan GPU backend, which needs the SDK's
      # headers and shader compiler. Installed users don't need it: without a Vulkan
      # driver Otto runs speech on the CPU.
      - name: Install the Vulkan SDK
        if: runner.os == 'Windows'
        uses: humbletim/install-vulkan-sdk@v1.2
        with:
          version: 1.4.309.0
          cache: true

      - name: Cache speech models
        uses: actions/cache@v4
        with:
          path: models
          key: parakeet-tdt-0.6b-v2-q8_0+silero-vad-v6.2

      - name: Fetch speech models
        run: sh scripts/fetch-model.sh

      - run: npm ci

      # The app compares its own version with the latest release, so a tag sets it.
      - name: Use the tag as the app version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          v="${GITHUB_REF_NAME#v}"
          node -e "const f='src-tauri/tauri.conf.json',j=require('./'+f);j.version=process.argv[1];require('fs').writeFileSync(f,JSON.stringify(j,null,2))" "$v"
          perl -pi -e 'if (!$done && s/^version = "[^"]*"/version = "'"$v"'"/) { $done = 1 }' src-tauri/Cargo.toml
          grep -m1 '^version' src-tauri/Cargo.toml

      - name: Rust tests
        working-directory: src-tauri
        run: cargo test

      - name: Build the app and installer
        run: npm run tauri build

      - name: Keep the installer with this run
        uses: actions/upload-artifact@v4
        with:
          name: Otto-${{ matrix.os }}-${{ github.sha }}
          path: ${{ matrix.bundle }}
          retention-days: 14

  # Which parts changed, so app-only pushes skip the benchmark build.
  changes:
    runs-on: ubuntu-latest
    outputs:
      bench: ${{ steps.filter.outputs.bench }}
    steps:
      - uses: actions/checkout@v4
      - id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            bench:
              - "bench/**"
              - ".github/workflows/build.yml"

  # The speech benchmark (bench/) is a dev tool; this keeps it compiling with Metal so
  # it can run on a Mac. The Windows build runs it by hand (see bench/RESULTS.md).
  # It builds two copies of ggml, so it runs only when bench/ or this workflow changes.
  bench:
    needs: changes
    if: needs.changes.outputs.bench == 'true'
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: bench
      - name: Build the speech benchmark
        run: cargo build --release --manifest-path bench/Cargo.toml

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          v="${TAG#v}"
          cp out/Otto-macos-14-*/*.dmg "Otto-$v-AppleSilicon.dmg"
          cp out/Otto-windows-latest-*/*.exe "Otto-$v-Windows-Setup.exe"
          cat > notes.md <<'NOTES'
          **Mac** (Apple Silicon, macOS 13+): open the DMG and drag Otto to Applications. On first launch click Done (not Move to Trash), then System Settings > Privacy & Security > Open Anyway, or run `xattr -dr com.apple.quarantine /Applications/Otto.app` (not notarized yet).

          **Windows** 10/11 x64 (experimental): run the Setup exe. SmartScreen may warn because it isn't signed yet: click More info, then Run anyway. Also needs Git for Windows.

          Both need Claude Code installed; you sign in from Otto's setup window.
          NOTES
          gh release create "$TAG" "Otto-$v-AppleSilicon.dmg" "Otto-$v-Windows-Setup.exe" \
            --repo "$GITHUB_REPOSITORY" --title "Otto $v" --generate-notes --notes-file notes.md
