# Every push to main and every PR: tests, then a DMG kept as a workflow artifact.
# A pushed tag like v0.2.0 also publishes that DMG as a GitHub Release.
name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
    # Docs-only pushes don't need a 10-minute macOS build.
    paths-ignore: ["**.md", "docs/**"]
  pull_request:
    paths-ignore: ["**.md", "docs/**"]

permissions:
  contents: write # only used by the release step on tags

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macos:
    runs-on: macos-14 # Apple Silicon, matches the aarch64 DMG
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Cache speech model
        uses: actions/cache@v4
        with:
          path: models
          key: whisper-ggml-base.en

      - run: npm ci

      # The app compares its own version with the latest release, so a tag sets it.
      - name: Use the tag as the app version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          v="${GITHUB_REF_NAME#v}"
          node -e "const f='src-tauri/tauri.conf.json',j=require('./'+f);j.version=process.argv[1];require('fs').writeFileSync(f,JSON.stringify(j,null,2))" "$v"
          perl -pi -e 'if (!$done && s/^version = "[^"]*"/version = "'"$v"'"/) { $done = 1 }' src-tauri/Cargo.toml
          grep -m1 '^version' src-tauri/Cargo.toml

      - name: Rust tests
        working-directory: src-tauri
        run: cargo test

      - name: Build Otto.app and DMG
        run: npm run tauri build

      - name: Keep the DMG with this run
        uses: actions/upload-artifact@v4
        with:
          name: Otto-${{ github.sha }}
          path: src-tauri/target/release/bundle/dmg/*.dmg
          retention-days: 14

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          dmg=$(ls src-tauri/target/release/bundle/dmg/*.dmg)
          cp "$dmg" "Otto-${TAG#v}-AppleSilicon.dmg"
          gh release create "$TAG" "Otto-${TAG#v}-AppleSilicon.dmg" \
            --title "Otto ${TAG#v}" --generate-notes \
            --notes "Apple Silicon, macOS 13+. Needs Claude Code installed (you sign in from the setup window). Open the DMG, drag Otto to Applications, then on first launch click Done (not Move to Trash) and use System Settings > Privacy & Security > Open Anyway, or run: xattr -dr com.apple.quarantine /Applications/Otto.app (this build isn't notarized yet)."
