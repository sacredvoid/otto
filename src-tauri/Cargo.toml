[package]
name = "otto"
version = "0.4.1"
description = "Your always-on assistant for the busywork on your computer."
authors = ["Samanvya Tripathi"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "otto_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api", "tray-icon", "image-png"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
cpal = "0.18"
dirs = "6"
tiny_http = "0.12"
getrandom = "0.3"


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-global-shortcut = "2"

# Speech (Parakeet / Whisper GGUF) runs through transcribe-cpp. Windows x64 loads the
# GPU backends (Vulkan) at runtime from DLLs staged by build.rs, so a PC without a Vulkan
# driver still starts and runs on the CPU. Macs use static Metal; other targets CPU only.
[target.'cfg(all(windows, target_arch = "x86_64"))'.dependencies]
transcribe-cpp = { version = "0.4", default-features = false, features = ["dynamic-backends", "vulkan"] }

[target.'cfg(not(any(all(windows, target_arch = "x86_64"), target_os = "macos")))'.dependencies]
transcribe-cpp = { version = "0.4", default-features = false }

[target.'cfg(windows)'.dependencies]
tauri-plugin-single-instance = "2"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging"] }

[target.'cfg(target_os = "macos")'.dependencies]
transcribe-cpp = { version = "0.4", default-features = false, features = ["metal"] }
objc2 = "0.6"
block2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSGeometry", "NSString"] }
