[package]
name = "tc"
version = "0.1.0"
edition = "2024"

[dependencies]
stt_bench_common = { path = "../common" }
serde_json = "1"

# Same layout as Otto: Windows loads GPU backends dynamically; macOS uses static Metal.
# (Static builds expose no DEP_TRANSCRIBE_CPP_RUNTIME_DIR, so build.rs returns early.)
[target.'cfg(windows)'.dependencies]
transcribe-cpp = { version = "0.4", default-features = false, features = ["dynamic-backends", "vulkan"] }

[target.'cfg(target_os = "macos")'.dependencies]
transcribe-cpp = { version = "0.4", default-features = false, features = ["metal"] }
